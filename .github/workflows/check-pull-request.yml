name: Check Pull Request

on:
  pull_request:
    branches:
      - main
      - minimal
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

jobs:
  pr-validator:
    name: Run Pull Request Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Full history is required for Sonar blame and new code detection

      - name: Test code and Create Test Coverage Reports
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Security audit
        run: npm run security-audit

      - run: |
          npm ci
          npm run format:check
          npm run lint
          mkdir -p coverage
          chmod -R a+rw ./coverage
          docker compose -p apha-insights-ingestion-test -f compose.yaml -f compose.test.yaml run --build --rm apha-insights-ingestion

      - name: Test Docker Image Build
        run: |
          set +e
          docker build --no-cache --tag cdp-node-backend-template .
          exit $?

      - name: SonarCloud Scan
        if: github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  journey-tests:
    name: Run Journey Tests
    runs-on: ubuntu-latest
    steps:
      # Builds this pull request and main of every other service, then runs
      # the apha-risk-insights-e2e-tests suite against them
      - uses: DEFRA/apha-risk-insights-e2e-tests/run-journey-tests@main
